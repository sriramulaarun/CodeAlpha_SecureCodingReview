<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dashboard // Hardened App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #cbd5e1;
            margin: 0;
            padding: 30px;
        }
        .dashboard-box {
            background-color: #1e293b;
            border: 2px solid #10b981;
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
        }
        h2 { color: #10b981; border-bottom: 1px solid #10b981; padding-bottom: 10px; }
        .user-greeting { font-size: 1.2em; margin-bottom: 20px; }
        textarea {
            width: 100%;
            height: 120px;
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: monospace;
            margin-bottom: 15px;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: #10b981; outline: none; }
        input[type="submit"] {
            background-color: #10b981;
            border: none;
            color: #fff;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        input[type="submit"]:hover { background-color: #059669; }
        .notes-display {
            background-color: #0f172a;
            border-left: 4px solid #10b981;
            padding: 15px;
            margin-top: 25px;
            border-radius: 4px;
            color: #e2e8f0;
        }
        .logout-btn {
            display: inline-block;
            margin-top: 20px;
            color: #34d399;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="dashboard-box">
        <h2>Hardened User Dashboard</h2>
        <div class="user-greeting">Welcome back, <strong>{{ username }}</strong>!</div>

        <!-- Safe Profile Bio/Notes input -->
        <form action="/update_notes" method="POST">
            <label><strong>Edit Profile Bio/Notes:</strong> (HTML will be strictly escaped for security)</label>
            <textarea name="notes" placeholder="Enter bio details..." maxlength="500">{{ notes }}</textarea>
            <input type="submit" value="Save Profile Bio">
        </form>

        <!-- Stored XSS Render Area - Safe rendering -->
        <div class="notes-display">
            <h4>Sanitized Profile Output:</h4>
            <!-- SECURITY REMEDIATION: XSS prevented by using standard interpolation (removing 'safe' filter) -->
            <!-- Jinja2 automatically converts script tags to plain text HTML character entities -->
            <p>{{ notes }}</p>
        </div>

        <a href="/logout" class="logout-btn">Log Out Session</a>
    </div>
</body>
</html>
